name: publish interactive image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the exact local candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./images/interactive
          platforms: linux/amd64
          load: true
          tags: punch-interactive:candidate-${{ github.sha }}
      - name: Exercise non-root SSH through the fixed stdio bridge
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/punch-interactive-smoke"
          name="punch-interactive-smoke"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$key"
          authorized_key="$(base64 -w0 < "$key.pub")"
          docker run --detach --name "$name" \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /workspace:rw,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,uid=65532,gid=65532,mode=0700 \
            --env "PUNCH_BUYER_AUTHORIZED_KEY_BASE64=$authorized_key" \
            "punch-interactive:candidate-${GITHUB_SHA}"
          for attempt in {1..20}; do
            if docker exec "$name" test -s /workspace/.ssh/authorized_keys; then break; fi
            test "$attempt" -lt 20
            sleep 0.25
          done
          ssh -q -T \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o "ProxyCommand=docker exec -i --user 65532:65532 $name /usr/local/bin/punch-ssh-stdio" \
            -i "$key" punch@punch true
      - name: Publish the smoke-tested candidate
        shell: bash
        run: |
          set -euo pipefail
          target="ghcr.io/its-define/punch-interactive:sha-${GITHUB_SHA}"
          docker tag "punch-interactive:candidate-${GITHUB_SHA}" "$target"
          docker push "$target"
